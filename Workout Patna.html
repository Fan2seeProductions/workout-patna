<head>

  <title>Workout Patna — Find your gym person</title>
  <style>
/* Workout Patna — design tokens */

@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800;900&family=Bebas+Neue&display=swap');

:root {
  /* Brand palette */
  --wp-ink: #0B1F3A;          /* deep blue (primary) */
  --wp-ink-2: #143358;        /* deep blue 2 */
  --wp-ink-soft: #2C4A73;     /* deep blue, softer */
  --wp-orange: #F26B3A;       /* warm orange (action) */
  --wp-orange-soft: #FFE4D6;  /* orange tint */
  --wp-green: #6FB58A;        /* soft green (success/match) */
  --wp-green-soft: #E2F3E8;
  --wp-cream: #FBF7F1;        /* page bg */
  --wp-paper: #FFFFFF;
  --wp-line: #ECE4D7;         /* warm line */
  --wp-line-2: #DDD3C0;
  --wp-mute: #6E7A8A;         /* muted text */
  --wp-mute-2: #98A2B3;

  /* Type */
  --font-sans: 'Archivo', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-display: 'Archivo Black', 'Bebas Neue', Impact, sans-serif;
  --font-condensed: 'Bebas Neue', 'Archivo Black', Impact, sans-serif;

  /* Radii */
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 22px;
  --r-xl: 28px;

  /* Shadows */
  --shadow-card: 0 1px 2px rgba(11,31,58,0.04), 0 8px 24px rgba(11,31,58,0.06);
  --shadow-pop: 0 4px 12px rgba(11,31,58,0.08), 0 18px 40px rgba(11,31,58,0.10);
}

/* Dark variants exposed for the palette tweak */
.palette-dusk {
  --wp-ink: #0E1B2C;
  --wp-orange: #FF7A47;
  --wp-green: #7CCFA0;
  --wp-cream: #F4EFE6;
  --wp-line: #E3DAC8;
}

.palette-court {
  --wp-ink: #1B2A41;
  --wp-orange: #E5572B;
  --wp-green: #4FA773;
  --wp-cream: #F8F4ED;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font-sans);
  background: #1a1a1a;
  color: var(--wp-ink);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; color: inherit; }
input, textarea { font-family: inherit; }

/* Scrollbar hidden */
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }

/* === Reusable atoms === */

.wp-screen {
  width: 100%;
  height: 100%;
  background: var(--wp-cream);
  color: var(--wp-ink);
  font-family: var(--font-sans);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  padding-top: 56px; /* reserve room for iOS status bar */
}

.wp-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

.wp-h1 {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 40px;
  line-height: 0.95;
  letter-spacing: -0.015em;
  text-transform: uppercase;
  margin: 0;
}
.wp-h1 em { font-style: normal; color: var(--wp-orange); }

.wp-h2 {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 28px;
  line-height: 1.0;
  letter-spacing: -0.005em;
  text-transform: uppercase;
  margin: 0;
}

.wp-eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--wp-orange);
}

.wp-label {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--wp-mute);
}

.wp-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 52px;
  padding: 0 22px;
  border-radius: 9999px;
  background: var(--wp-ink);
  color: #fff;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 0.01em;
  transition: transform .12s ease, background .15s ease;
  white-space: nowrap;
}
.wp-btn:active { transform: scale(0.97); }
.wp-btn--orange { background: var(--wp-orange); }
.wp-btn--ghost { background: transparent; color: var(--wp-ink); border: 1.5px solid var(--wp-line-2); }
.wp-btn--green { background: var(--wp-green); color: #0B2D1A; }
.wp-btn--sm { height: 38px; font-size: 13.5px; padding: 0 16px; }

.wp-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 12px;
  border-radius: 9999px;
  background: #fff;
  border: 1px solid var(--wp-line);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--wp-ink);
  white-space: nowrap;
}
.wp-chip--solid { background: var(--wp-ink); color: #fff; border-color: var(--wp-ink); }
.wp-chip--orange { background: var(--wp-orange-soft); color: #B14217; border-color: transparent; }
.wp-chip--green { background: var(--wp-green-soft); color: #2D6845; border-color: transparent; }

.wp-card {
  background: var(--wp-paper);
  border-radius: var(--r-lg);
  border: 1px solid var(--wp-line);
  box-shadow: var(--shadow-card);
}

.wp-input {
  width: 100%;
  height: 52px;
  background: #fff;
  border: 1.5px solid var(--wp-line);
  border-radius: 14px;
  padding: 0 16px;
  font-size: 15px;
  color: var(--wp-ink);
  outline: none;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.wp-input:focus { border-color: var(--wp-ink); box-shadow: 0 0 0 4px rgba(11,31,58,0.08); }

.wp-divider {
  height: 1px;
  background: var(--wp-line);
  border: none;
  margin: 0;
}

/* Avatar — initials w/ tinted bg */
.wp-avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 9999px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  background: linear-gradient(140deg, #FFB590, #F26B3A);
}

/* Animated dot */
@keyframes wp-pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.4); opacity: 0.6; }
}
.wp-dot {
  width: 8px; height: 8px; border-radius: 9999px;
  background: var(--wp-green);
  animation: wp-pulse 1.8s ease-in-out infinite;
}

/* Tab bar */
.wp-tabbar {
  height: 78px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid var(--wp-line);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding: 8px 8px 22px;
  flex-shrink: 0;
}
.wp-tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--wp-mute-2);
  cursor: pointer;
  position: relative;
}
.wp-tab[data-active="true"] { color: var(--wp-ink); }
.wp-tab[data-active="true"] .wp-tab-icon { color: var(--wp-orange); }
.wp-tab-icon { color: var(--wp-mute-2); }

/* Subtle entrance */
@keyframes wp-fade-up {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.wp-fade-up { animation: wp-fade-up .35s ease both; }

/* Match toast */
@keyframes wp-pop {
  0% { opacity: 0; transform: scale(0.7); }
  60% { opacity: 1; transform: scale(1.05); }
  100% { transform: scale(1); }
}
.wp-pop { animation: wp-pop .45s cubic-bezier(.2,1.5,.4,1) both; }

<script type="text/babel">
(function(){

// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {

}

      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

})();
</script>

function PickGrid({ options, value, setValue, multi = false, columns = 2 }) {
  const isSel = (o) => multi ? value.includes(o) : value === o;

    if (multi) {
      setValue(value.includes(o) ? value.filter(x => x !== o) : [...value, o]);
    } else {
      setValue(o);
    }
  };
  return (
    <div style={{ display: 'grid', gridTemplateColumns: `repeat(${columns}, 1fr)`, gap: 10 }}>
      {options.map(o => {
        const sel = isSel(o);
        return (
          <button key={o} onClick={() => toggle(o)} style={{
            padding: '16px 14px', borderRadius: 16,
            background: sel ? 'var(--wp-ink)' : '#fff',
            color: sel ? '#fff' : 'var(--wp-ink)',

              <m.Icon size={15} color="var(--wp-ink)"/>{m.label}
            </button>
          ))}
        </div>
      </div>

      {mode === 'cards' && <BrowseCards people={people} onOpenPerson={onOpenPerson} onMatch={onMatch}/>}
      {mode === 'feed' && <BrowseFeed people={people} onOpenPerson={onOpenPerson} onMatch={onMatch}/>}
      {mode === 'list' && <BrowseList people={people} onOpenPerson={onOpenPerson} onMatch={onMatch}/>}
    </div>
  );
}

// Cards (Tinder-style swipe)
function BrowseCards({ people, onOpenPerson, onMatch }) {
  const [idx, setIdx] = useStateApp(0);
  const [drag, setDrag] = useStateApp({ x: 0, y: 0, active: false });
  const startRef = useRefApp({ x: 0, y: 0 });

  const onPointerDown = (e) => {
    startRef.current = { x: e.clientX, y: e.clientY };
    setDrag({ x: 0, y: 0, active: true });
  };
  const onPointerMove = (e) => {
    if (!drag.active) return;
    setDrag({ x: e.clientX - startRef.current.x, y: e.clientY - startRef.current.y, active: true });
  };
  const onPointerUp = () => {
    if (Math.abs(drag.x) > 90) {
      const liked = drag.x > 0;
      if (liked && Math.random() > 0.5) onMatch?.(people[idx]);
      setIdx(i => Math.min(i + 1, people.length));
    }
    setDrag({ x: 0, y: 0, active: false });
  };

  if (idx >= people.length) {
    return (
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 32, textAlign: 'center' }}>
        <div style={{ fontSize: 56, marginBottom: 12 }}>🏁</div>
        <div className="wp-h2">You've seen everyone.</div>
        <p style={{ fontSize: 14, color: 'var(--wp-mute)', marginTop: 8, maxWidth: 260 }}>New lifters check in daily. We'll ping you when someone new arrives at your gym.</p>
        <button className="wp-btn wp-btn--orange wp-btn--sm" style={{ marginTop: 18 }} onClick={() => setIdx(0)}>Start over</button>
      </div>
    );
  }

  const top = people[idx];
  const next = people[idx + 1];
  const rotation = drag.x * 0.06;
  const likeOpacity = Math.max(0, Math.min(1, drag.x / 100));
  const nopeOpacity = Math.max(0, Math.min(1, -drag.x / 100));

  return (
    <div style={{ flex: 1, padding: '6px 20px 12px', position: 'relative', overflow: 'hidden' }}>
      {/* next card behind */}
      {next && (
        <div style={{
          position: 'absolute', inset: '6px 28px 80px', borderRadius: 24,
          transform: 'scale(0.95)', opacity: 0.7, pointerEvents: 'none',
        }}>
          <CardFace person={next} compact/>
        </div>
      )}
      {/* top card */}
      <div
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={onPointerUp}
        onPointerCancel={onPointerUp}
        onClick={() => Math.abs(drag.x) < 5 && onOpenPerson(top.id)}
        style={{
          position: 'absolute', inset: '6px 20px 80px', borderRadius: 24,
          transform: `translate(${drag.x}px, ${drag.y * 0.4}px) rotate(${rotation}deg)`,
          transition: drag.active ? 'none' : 'transform .35s cubic-bezier(.2,1.2,.4,1)',
          touchAction: 'none', userSelect: 'none',
        }}>
        <CardFace person={top} likeOpacity={likeOpacity} nopeOpacity={nopeOpacity}/>
      </div>

      {/* Swipe action buttons */}
      <div style={{
        position: 'absolute', bottom: 16, left: 0, right: 0,
        display: 'flex', justifyContent: 'center', gap: 18, pointerEvents: 'none',
      }}>
        <button onClick={() => setIdx(i => i + 1)} style={{
          pointerEvents: 'auto', width: 56, height: 56, borderRadius: 9999,
          background: '#fff', border: '1.5px solid var(--wp-line)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          boxShadow: 'var(--shadow-card)',
        }}>
          <IconClose size={24} color="var(--wp-mute)"/>
        </button>
        <button onClick={() => onOpenPerson(top.id)} style={{
          pointerEvents: 'auto', width: 50, height: 50, borderRadius: 9999,
          background: '#fff', border: '1.5px solid var(--wp-line)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          boxShadow: 'var(--shadow-card)',
        }}>
          <IconUser size={20} color="var(--wp-ink)"/>
        </button>
        <button onClick={() => { onMatch?.(top); setIdx(i => i + 1); }} style={{
          pointerEvents: 'auto', width: 56, height: 56, borderRadius: 9999,
          background: 'var(--wp-orange)', display: 'flex', alignItems: 'center', justifyContent: 'center',
          boxShadow: '0 6px 18px rgba(242,107,58,0.4)',
        }}>
          <IconDumbbell size={24} color="#fff"/>
        </button>
      </div>
    </div>
  );
}

function ScreenChat({ threadId, onBack }) {
  const thread = window.WP_THREADS.find(t => t.id === threadId);
  const person = window.WP_PEOPLE.find(p => p.id === thread?.personId);
  const [msgs, setMsgs] = useStateApp(thread?.messages || []);
  const [input, setInput] = useStateApp('');
  const scrollRef = useRefApp(null);

  useEffectApp(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [msgs]);

  const send = () => {
    if (!input.trim()) return;
    setMsgs(m => [...m, { from: 'me', text: input, time: 'now' }]);
    setInput('');
    setTimeout(() => {
      setMsgs(m => [...m, { from: 'them', text: 'Sounds good — see you there 💪', time: 'now' }]);
    }, 1100);
  };

  if (!thread) return null;

  return (
    <div className="wp-screen">
      {/* Header */}
      <div style={{ padding: '8px 14px 10px', display: 'flex', alignItems: 'center', gap: 10, borderBottom: '1px solid var(--wp-line)', background: '#fff' }}>

          <IconBack size={20} color="var(--wp-ink)"/>
        </button>
        <Avatar person={person} size={38}/>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 15, fontWeight: 700, lineHeight: 1.1 }}>{person.name}</div>
          <div style={{ fontSize: 11.5, color: 'var(--wp-green)', display: 'flex', alignItems: 'center', gap: 4, marginTop: 2 }}>
            <span className="wp-dot" style={{ width: 6, height: 6 }}/> at the gym now
          </div>
        </div>
        <button style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <IconMore size={20} color="var(--wp-ink)"/>
        </button>
      </div>

      {/* Messages */}
      <div ref={scrollRef} className="wp-scroll" style={{ padding: '14px 16px 8px', display: 'flex', flexDirection: 'column', gap: 8 }}>
        {/* Match banner */}
        <div style={{
          textAlign: 'center', padding: '10px 14px',
          background: 'var(--wp-orange-soft)', borderRadius: 14,
          fontSize: 12.5, color: '#7A3815', margin: '4px auto 8px', maxWidth: 280,
        }}>
          You matched 3 days ago · Both train at Planet Fitness Southside
        </div>

        {msgs.map((m, i) => (
          <div key={i} style={{ display: 'flex', justifyContent: m.from === 'me' ? 'flex-end' : 'flex-start' }}>
            <div style={{
              maxWidth: '76%', padding: '10px 14px',
              borderRadius: m.from === 'me' ? '18px 18px 4px 18px' : '18px 18px 18px 4px',
              background: m.from === 'me' ? 'var(--wp-ink)' : '#fff',
              color: m.from === 'me' ? '#fff' : 'var(--wp-ink)',
              border: m.from === 'me' ? 'none' : '1px solid var(--wp-line)',
              fontSize: 14.5, lineHeight: 1.4,
            }}>{m.text}</div>
          </div>
        ))}
      </div>

      {/* Quick reply chips */}
      <div className="no-scrollbar" style={{ display: 'flex', gap: 8, padding: '6px 16px 8px', overflowX: 'auto' }}>
        {['📅 Lift today?', '6am works', '🤝 Spot me?', 'Running 10 late'].map(q => (
          <button key={q} onClick={() => setInput(q)} style={{
            padding: '8px 14px', borderRadius: 9999, background: '#fff',
            border: '1px solid var(--wp-line)', fontSize: 13, fontWeight: 500,
            whiteSpace: 'nowrap', flexShrink: 0,
          }}>{q}</button>
        ))}
      </div>

      {/* Composer */}
      <div style={{ padding: '6px 12px 18px', display: 'flex', gap: 8, alignItems: 'center', background: 'var(--wp-cream)', borderTop: '1px solid var(--wp-line)' }}>
        <input
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && send()}
          placeholder="Message…"
          style={{
            flex: 1, height: 44, background: '#fff',
            border: '1px solid var(--wp-line)', borderRadius: 9999,
            padding: '0 18px', fontSize: 14.5, outline: 'none', color: 'var(--wp-ink)',
          }}
        />
        <button onClick={send} style={{
          width: 44, height: 44, borderRadius: 9999, background: 'var(--wp-orange)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          boxShadow: '0 4px 12px rgba(242,107,58,0.35)',
        }}>
          <IconSend size={18} color="#fff"/>
        </button>
      </div>
    </div>
  );
}

        {/* Stats */}

        {/* Premium upsell */}
        <div className="wp-card" style={{

          }}/>
          <div style={{ position: 'relative' }}>
            <div className="wp-eyebrow" style={{ color: 'var(--wp-orange)' }}>Patna Plus</div>

              Unlimited matches. <em style={{ color: 'var(--wp-orange)', fontStyle: 'italic' }}>$10/mo.</em>
            </h3>
            <ul style={{ margin: '12px 0', padding: 0, listStyle: 'none', fontSize: 13.5, opacity: 0.85, lineHeight: 1.7 }}>

              ['Schedule', 'Weekday 6–7am'],

            ].map(([label, val], i) => (

// ────────────────────────────────────────────────────────────

  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 60,
      background: 'rgba(11,31,58,0.85)', backdropFilter: 'blur(8px)',

Object.assign(window, {
  Avatar, ProfilePhoto, TabBar,
  ScreenHome, ScreenBrowse, ScreenMatches, ScreenChat, ScreenMe,
  ProfileDetail, MatchPopup,
});

})();
</script>
<script type="text/babel">
(function(){
// Workout Patna — root app (router + tweaks)

const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "matchMode": "cards",
  "palette": "default",
  "density": "comfortable",
  "startScreen": "auth"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);

  // Top-level route
  const [route, setRoute] = useState(tweaks.startScreen || 'auth'); // auth | onboard | app
  const [authMode, setAuthMode] = useState('signup');

  // Onboarding state
  const [onbStep, setOnbStep] = useState(1);
  const [onb, setOnb] = useState({ gym: null, level: null, goals: [], vibe: [] });

  // App state
  const [tab, setTab] = useState('home');
  const [openPersonId, setOpenPersonId] = useState(null);
  const [openThreadId, setOpenThreadId] = useState(null);
  const [matchedPerson, setMatchedPerson] = useState(null);

  const user = { gym: onb.gym || 'planet-southside', level: onb.level || 'Intermediate' };

  // Apply palette class to wrapper
  const paletteCls = tweaks.palette === 'dusk' ? 'palette-dusk'
                    : tweaks.palette === 'court' ? 'palette-court' : '';

  // Onboarding navigation
  const onbNext = () => {
    if (onbStep < 4) setOnbStep(onbStep + 1);
    else setRoute('app');
  };
  const onbBack = () => {
    if (onbStep > 1) setOnbStep(onbStep - 1);
    else setRoute('auth');
  };

  let screen;
  if (route === 'auth') {
    screen = <ScreenAuth mode={authMode} setMode={setAuthMode} onContinue={() => { setRoute('onboard'); setOnbStep(1); }}/>;
  } else if (route === 'onboard') {
    const shellProps = {
      step: onbStep, total: 4,
      onBack: onbBack,
      onNext: onbNext,
      onSkip: onbStep === 4 ? null : () => setOnbStep(onbStep + 1),
    };
    if (onbStep === 1) screen = <ScreenOnboardGym {...shellProps} value={onb.gym} setValue={(v) => setOnb({ ...onb, gym: v })} nextDisabled={!onb.gym}/>;
    else if (onbStep === 2) screen = <ScreenOnboardLevel {...shellProps} value={onb.level} setValue={(v) => setOnb({ ...onb, level: v })} nextDisabled={!onb.level}/>;
    else if (onbStep === 3) screen = <ScreenOnboardGoals {...shellProps} value={onb.goals} setValue={(v) => setOnb({ ...onb, goals: v })} nextDisabled={onb.goals.length === 0}/>;
    else screen = <ScreenOnboardVibe {...shellProps} value={onb.vibe} setValue={(v) => setOnb({ ...onb, vibe: v })} nextDisabled={onb.vibe.length === 0}/>;
  } else {
    // app
    if (openThreadId) {
      screen = <ScreenChat threadId={openThreadId} onBack={() => setOpenThreadId(null)}/>;
    } else {
      const tabScreen = (() => {
        if (tab === 'home') return <ScreenHome user={user} onOpenPerson={setOpenPersonId} onGoTo={setTab}/>;
        if (tab === 'browse') return <ScreenBrowse user={user} mode={tweaks.matchMode} onMetaphorChange={(m) => setTweak('matchMode', m)} onOpenPerson={setOpenPersonId} onMatch={setMatchedPerson}/>;
        if (tab === 'matches') return <ScreenMatches onOpenChat={setOpenThreadId} onOpenPerson={setOpenPersonId}/>;
        if (tab === 'chat') return <ScreenMatches onOpenChat={setOpenThreadId} onOpenPerson={setOpenPersonId}/>;
        if (tab === 'me') return <ScreenMe user={user} onLogout={() => setRoute('auth')}/>;
      })();

      screen = (
        <div style={{ width: '100%', height: '100%', display: 'flex', flexDirection: 'column' }}>
          <div style={{ flex: 1, minHeight: 0, position: 'relative' }}>
            {tabScreen}
          </div>
          <TabBar active={tab} onChange={setTab} badge={{ matches: 6, chat: 2 }}/>
        </div>
      );
    }
  }

  // Profile detail overlay (works across tabs)
  const openPerson = openPersonId ? window.WP_PEOPLE.find(p => p.id === openPersonId) : null;

  return (
    <div className={paletteCls} style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <window.IOSDevice width={402} height={874} dark={route === 'auth'} dynamicIsland>
        <div style={{ width: '100%', height: '100%', position: 'relative', background: 'var(--wp-cream)' }}>
          {screen}
          {openPerson && route === 'app' && (
            <ProfileDetail
              person={openPerson}
              onClose={() => setOpenPersonId(null)}
              onMatch={(p) => { setMatchedPerson(p); }}
            />
          )}
          {matchedPerson && (
            <MatchPopup
              person={matchedPerson}
              onClose={() => setMatchedPerson(null)}
              onMessage={() => {
                setMatchedPerson(null);
                setOpenPersonId(null);
                // open existing thread if exists else 1st
                const existing = window.WP_THREADS.find(t => t.personId === matchedPerson.id);
                setOpenThreadId(existing ? existing.id : window.WP_THREADS[0].id);
                setTab('chat');
              }}
            />
          )}
        </div>
      </window.IOSDevice>

      {/* Tweaks panel */}
      <window.TweaksPanel title="Tweaks">
        <window.TweakSection label="Match metaphor"/>
        <window.TweakRadio
          label="Browse style"
          value={tweaks.matchMode}
          onChange={(v) => setTweak('matchMode', v)}
          options={[
            { value: 'cards', label: 'Cards' },
            { value: 'feed', label: 'Feed' },
            { value: 'list', label: 'Roster' },
          ]}
        />
        <window.TweakSection label="Palette"/>
        <window.TweakRadio
          label="Color"
          value={tweaks.palette}
          onChange={(v) => setTweak('palette', v)}
          options={[
            { value: 'default', label: 'Default' },
            { value: 'dusk', label: 'Dusk' },
            { value: 'court', label: 'Court' },
          ]}
        />
        <window.TweakSection label="Jump to"/>
        <window.TweakButton label="Auth screen" onClick={() => { setRoute('auth'); }}/>
        <window.TweakButton label="Onboarding" onClick={() => { setRoute('onboard'); setOnbStep(1); }}/>
        <window.TweakButton label="Home" onClick={() => { setRoute('app'); setTab('home'); }}/>
        <window.TweakButton label="Browse" onClick={() => { setRoute('app'); setTab('browse'); }}/>
        <window.TweakButton label="Matches" onClick={() => { setRoute('app'); setTab('matches'); }}/>
        <window.TweakButton label="Open chat" onClick={() => { setRoute('app'); setOpenThreadId('t1'); }}/>
        <window.TweakButton label="Me" onClick={() => { setRoute('app'); setTab('me'); }}/>
      </window.TweaksPanel>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);

})();
</script>
</body>
</html>
